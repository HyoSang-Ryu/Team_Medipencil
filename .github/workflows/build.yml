name: Build and test PoC

on:
  push:
    branches: [main, 'poc/**', 'codex/**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r apps/api/requirements.lock.txt
          .venv/bin/python -m pip install --no-deps -e apps/api
      - name: Install frontend dependencies
        run: npm --prefix apps/web ci
      - name: Check Python and test API
        run: |
          .venv/bin/python -m compileall -q apps/api/src tools/dev tools/deploy
          .venv/bin/python -m pytest apps/api/tests -q
      - name: Check TypeScript and test frontend
        run: |
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run test:run
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Test direct-input care loop with temporary SQLite
        run: npm --prefix apps/web run test:e2e
      - name: Verify generated manuals
        run: |
          python tools/dev/export_manual.py
          git diff --exit-code -- docs/poc/user-manual.fi.md docs/poc/user-manual.ko.md docs/poc/user-manual.en.md
      - name: Build web for the shared server
        env:
          MEDIPENCIL_WEB_BASE: /medipencil/
        run: npm --prefix apps/web run build
      - name: Build Python wheel
        run: .venv/bin/python -m pip wheel --no-deps --wheel-dir build/api apps/api
      - name: Record build revision
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('apps/web/dist/build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'base': '/medipencil/',
              'mode': 'BUILD_ONLY_NO_AI',
          }, indent=2) + '\n')
          PY
      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medipencil-web-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload API wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medipencil-api-${{ github.sha }}
          path: build/api/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Build GitHub Pages static files
        if: github.ref == 'refs/heads/poc/remote-validation' && github.event_name != 'pull_request'
        env:
          MEDIPENCIL_WEB_BASE: /Team_Medipencil/
          VITE_MEDIPENCIL_HASH_ROUTER: '1'
          VITE_MEDIPENCIL_API_BASE: https://orch.sungah.kr/medipencil/api/v1
        run: |
          npm --prefix apps/web run build
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('apps/web/dist/build-info.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'hosting':'github-pages','data':'shared-api'}))
          PY
      - name: Upload GitHub Pages files
        if: github.ref == 'refs/heads/poc/remote-validation' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist

  deploy-pages:
    if: github.ref == 'refs/heads/poc/remote-validation' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static files to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-pages:
    if: github.ref == 'refs/heads/poc/remote-validation' && github.event_name != 'pull_request'
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Check deployed revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          for attempt in range(20):
              try:
                  url='https://hyosang-ryu.github.io/Team_Medipencil/build-info.json?commit='+os.environ['EXPECTED_SHA']
                  with urllib.request.urlopen(url,timeout=15) as response:info=json.load(response)
                  if info['commit']==os.environ['EXPECTED_SHA']:break
              except Exception:pass
              time.sleep(5)
          else:raise SystemExit('Pages did not serve the expected revision')
          PY
      - name: Verify Pages and shared API from GitHub without VPN
        working-directory: apps/web
        run: npx playwright test --config playwright.pages.config.ts --grep 'loads and reaches'
