<tspan x="42" dy="0">Carer: Liisa asks whether you have been going</tspan>
<tspan x="42" dy="29">out.</tspan>
<tspan x="42" dy="29">Aino: My knee has been sore, I have not dared</tspan>
<tspan x="42" dy="29">to go alone.</tspan>
<tspan x="42" dy="29">Carer: Shall we go together after lunch, with</tspan>
<tspan x="42" dy="29">the walker?</tspan>
<tspan x="42" dy="29">Aino: Yes, let’s.</tspan>
<tspan x="42" dy="29">Carer: I will also tell the nurse about the</tspan>
<tspan x="42" dy="29">knee. Sunday visits are fine. May I tell</tspan>
<tspan x="42" dy="29">Mikko about the walks too?</tspan>
<tspan x="42" dy="29">Aino: Yes.</tspan>
</text>
