<text x="32" y="230" font-size="22" font-weight="400" style="fill:#21374a">
<tspan x="32" dy="0">동의·권한은 모든 단계에 적용 · 확인 시점에 갱신 · 실제 업무 절감은 검증 대상</tspan>
