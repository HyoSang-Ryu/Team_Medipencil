<text x="834" y="114" font-size="20" font-weight="400" style="fill:#21374a">
<tspan x="834" dy="0">→</tspan>
</text>
<rect x="857" y="27" width="250" height="155" rx="10" fill="#edf4f8" stroke="#dbe3eb"/>
