<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300"><title>질문이 확인된 기록과 가족 답으로 돌아오는 돌봄 루프</title><style>text{font-family:"Noto Sans CJK KR",sans-serif;fill:#21374a}.title{font-size:28px;font-weight:700}.small{font-size:14px;fill:#526779}.body{font-size:19px}</style><rect x="2" y="2" width="1396" height="296" rx="18" fill="white" stroke="#cbd5df"/>
<rect x="20" y="27" width="250" height="155" rx="10" fill="#edf4f8" stroke="#dbe3eb"/>
<text x="37" y="67" font-size="23" font-weight="700" style="fill:#21374a">
