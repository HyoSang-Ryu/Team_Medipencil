<svg xmlns="http://www.w3.org/2000/svg" width="724" height="1210" viewBox="0 0 724 1210"><title>Tue 15:00 · approved records</title><style>text{font-family:"Noto Sans CJK KR",sans-serif;fill:#21374a}.title{font-size:28px;font-weight:700}.small{font-size:14px;fill:#526779}.body{font-size:19px}</style><rect x="2" y="2" width="720" height="1206" rx="18" fill="white" stroke="#cbd5df"/>
<text x="25" y="43" font-size="16" font-weight="400" style="fill:#21374a">
<tspan x="25" dy="0">Aino · Koivukoti · viewing as Liisa · FI / SV / EN</tspan>
</text>
<text x="25" y="88" font-size="27" font-weight="700" style="fill:#21374a">
<tspan x="25" dy="0">Tue 15:00 · approved records</tspan>
</text>
<rect x="22" y="119" width="680" height="84" rx="10" fill="#f1edfa" stroke="#dbe3eb"/>
<text x="39" y="145" font-size="15" font-weight="700" style="fill:#526779">
<tspan x="39" dy="0">Your question · answered</tspan>
</text>
<text x="39" y="176" font-size="18" font-weight="400" style="fill:#21374a">
<tspan x="39" dy="0">Has she stopped going out?</tspan>
</text>
<rect x="22" y="216" width="680" height="135" rx="10" fill="#eef8f2" stroke="#dbe3eb"/>
<text x="39" y="242" font-size="15" font-weight="700" style="fill:#526779">
<tspan x="39" dy="0">Confirmed resident statement</tspan>
</text>
<text x="39" y="273" font-size="18" font-weight="400" style="fill:#21374a">
<tspan x="39" dy="0">Aino told the carer that her knee has been sore, so</tspan>
<tspan x="39" dy="27">she has not dared to go out alone.</tspan>
</text>
<text x="39" y="338" font-size="12" font-weight="400" style="fill:#526779">
<tspan x="39" dy="0">Care note 08:32 · approved by Koskinen 08:40</tspan>
</text>
<rect x="22" y="364" width="680" height="108" rx="10" fill="#eef8f2" stroke="#dbe3eb"/>
<text x="39" y="390" font-size="15" font-weight="700" style="fill:#526779">
<tspan x="39" dy="0">Confirmed care action</tspan>
</text>
<text x="39" y="421" font-size="18" font-weight="400" style="fill:#21374a">
<tspan x="39" dy="0">After lunch Aino walked outside with a carer.</tspan>
</text>
<text x="39" y="459" font-size="12" font-weight="400" style="fill:#526779">
<tspan x="39" dy="0">Carer confirmation 13:28 · approved 13:30</tspan>
</text>
<rect x="22" y="485" width="680" height="108" rx="10" fill="#f6f8fa" stroke="#dbe3eb"/>
<text x="39" y="511" font-size="15" font-weight="700" style="fill:#526779">
<tspan x="39" dy="0">Aino said · translated from Finnish</tspan>
</text>
<text x="39" y="542" font-size="18" font-weight="400" style="fill:#21374a">
<tspan x="39" dy="0">“It was nice to be outside.”</tspan>
</text>
<text x="39" y="580" font-size="12" font-weight="400" style="fill:#526779">
<tspan x="39" dy="0">Care note 13:28</tspan>
</text>
<rect x="22" y="606" width="680" height="108" rx="10" fill="#f6f8fa" stroke="#dbe3eb"/>
<text x="39" y="632" font-size="15" font-weight="700" style="fill:#526779">
<tspan x="39" dy="0">Outdoors · observed</tspan>
</text>
<text x="39" y="663" font-size="18" font-weight="400" style="fill:#21374a">
<tspan x="39" dy="0">Door record 13:05–13:25</tspan>
</text>
<text x="39" y="701" font-size="12" font-weight="400" style="fill:#526779">
<tspan x="39" dy="0">Door sensor</tspan>
</text>
<rect x="22" y="727" width="680" height="135" rx="10" fill="#f6f8fa" stroke="#dbe3eb"/>
<text x="39" y="753" font-size="15" font-weight="700" style="fill:#526779">
<tspan x="39" dy="0">Follow-up · plan, not confirmed</tspan>
</text>
<text x="39" y="784" font-size="18" font-weight="400" style="fill:#21374a">
<tspan x="39" dy="0">The carer will tell the nurse about the knee. Not</tspan>
<tspan x="39" dy="27">confirmed yet.</tspan>
</text>
<text x="39" y="849" font-size="12" font-weight="400" style="fill:#526779">
<tspan x="39" dy="0">Care note 08:32</tspan>
</text>
<text x="25" y="892" font-size="14" font-weight="400" style="fill:#21374a">
<tspan x="25" dy="0">Language changes keep the same user. Demo-user switching is a</tspan>
<tspan x="25" dy="23">separate action.</tspan>
</text>
<text x="22" y="1193" font-size="12" font-weight="400" style="fill:#526779">
<tspan x="22" dy="0">DESIGN MOCKUP · v1.1 · TEAM_SYNTHETIC · NOT IMPLEMENTED</tspan>
</text>
</svg>